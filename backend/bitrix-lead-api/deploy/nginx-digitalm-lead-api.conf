# This snippet is included inside both Bitrix HTTP/HTTPS server blocks.
# The HTTP branch redirects to TLS; application traffic never runs in cleartext.
location = /digitalm-form/lead {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    limit_except POST OPTIONS {
        deny all;
    }

    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9016/lead;
}
